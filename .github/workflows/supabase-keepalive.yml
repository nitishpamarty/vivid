name: Supabase keepalive

# Free-tier Supabase projects auto-pause after 7 days with no API activity.
# One lightweight request every 2 days keeps the project active through the
# review window. Uses the anon key, which is already public in the deployed
# JS bundle, so no secret is needed.
on:
  schedule:
    - cron: '0 12 */2 * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST endpoint
        run: |
          curl -sf "https://dmptvjkvbpxomxxzqjal.supabase.co/rest/v1/" \
            -H "apikey: sb_publishable_tcfQTdQpIXCgobOzngin4w_Zg_xtyCn"
